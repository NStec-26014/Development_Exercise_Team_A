<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>商品一覧</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>
    <div th:replace="~{admin/fragments/layout :: header}"></div>
    <div class="container mt-4">

        <div class="admin-panel p-4">
            <h2 class="text-center mb-4">商品一覧</h2>

            <!-- カテゴリ検索 -->
            <form th:action="@{/admin/product}" method="get" class="d-flex justify-content-center gap-2 mb-4">
                <select name="category" class="form-select w-auto">
                    <option value="0">すべて</option>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"
                        th:selected="${selectedProductCategory != null and selectedProductCategory == cat.id}">
                    </option>
                </select>
                <button type="submit" class="btn btn-fs-solid">カテゴリ検索</button>
                <a th:href="@{/admin/product/add}" class="btn btn-fs">商品追加</a>
            </form>

            <!-- 商品一覧 -->
            <div class="alert alert-danger text-start mx-auto mb-4" style="max-width: 960px;" th:if="${errorMessage}">
                <span th:text="${errorMessage}">ここにメッセージが表示されます</span>
            </div>
            <table class="table table-bordered table-striped text-center align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>カテゴリ</th>
                        <th>商品名</th>
                        <th>単価</th>
                        <th>画像</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="product : ${products}">
                        <td th:text="${product.id}"></td>
                        <td th:text="${product.productCategoryId}"></td>
                        <td th:text="${product.name}"></td>
                        <td th:text="${product.price}"></td>
                        <td>
                            <img class="table-thumb" th:src="${product.imageUrl}" alt="商品画像">
                        </td>
                        <td>
                            <a th:href="@{/admin/product/edit/{id}(id=${product.id})}"
                                class="btn btn-warning btn-sm me-2">修正</a>
                            <a th:href="@{/admin/product/delete/{id}(id=${product.id})}"
                                class="btn btn-danger btn-sm">削除</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- ページネーション -->
        <nav th:if="${totalPages > 1}">
            <ul class="pagination justify-content-center">

                <!-- 最初へ -->
                <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                    <a class="page-link"
                        th:href="@{/admin/product(category=${selectedProductCategory}, page=1)}">最初へ</a>
                </li>

                <!-- ページ番号 -->
                <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}"
                    th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{/admin/product(category=${selectedProductCategory}, page=${i})}"
                        th:text="${i}"></a>
                </li>

                <!-- 最後へ -->
                <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                    <a class="page-link"
                        th:href="@{/admin/product(category=${selectedProductCategory}, page=${totalPages})}">最後へ</a>
                </li>

            </ul>
        </nav>

    </div>
</body>

</html>
