<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>商品修正(確認) - フルネス文具 管理画面</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>
    <div th:replace="~{admin/fragments/layout :: header}"></div>

    <main class="container">
        <div class="admin-panel p-4 mx-auto text-center" style="max-width: 480px;">
            <h1 class="mb-4">商品修正(確認)</h1>


            <div class="alert alert-danger text-start mx-auto mb-4" th:if="${errorMessage}">
                <span th:text="${errorMessage}">登録処理に失敗しました。管理者に連絡してください。</span>
            </div>
            

            <table class="table text-start">
                <tbody>
                    <tr>
                        <th class="w-25">商品名</th>
                        <td th:text="${form.name}"></td>
                    </tr>
                    <tr>
                        <th>単価</th>
                        <td th:text="${form.price} + '円'"></td>
                    </tr>
                    <tr>
                        <th>在庫数</th>
                        <td th:text="${form.quantity}"></td>
                    </tr>
                    <tr>
                        <th>商品カテゴリ</th>
                        <td th:each="cat : ${categories}" th:if="${cat.id == form.productCategoryId}"
                            th:text="${cat.name}"></td>
                    </tr>
                </tbody>
            </table>
            <!-- <img th:src="@{${form.imageUrl}}" th:alt="${form.name}" class="img-fluid mb-4" style="max-height: 160px;"> -->

            <!-- 💡 ①「戻る」ボタン専用の送信フォーム（宛先はconfirmのまま） -->
            <form th:action="@{/admin/product/edit/confirm}" method="post" style="display: inline;">
                <!-- データを消さずに戻すため、入力された値を裏側で抱えておきます -->
                <input type="hidden" name="id" th:value="${form.id}">
                <input type="hidden" name="name" th:value="${form.name}">
                <input type="hidden" name="price" th:value="${form.price}">
                <input type="hidden" name="quantity" th:value="${form.quantity}">
                <input type="hidden" name="productCategoryId" th:value="${form.productCategoryId}">
                <input type="hidden" name="imageUrl" th:value="${form.imageUrl}">

                <button type="submit" name="action" value="back" class="btn btn-fs px-4">戻る</button>
            </form>

            <!-- 💡 ②「完了」ボタン専用の送信フォーム（宛先を保存用のexecuteに変更！） -->
            <form th:action="@{/admin/product/edit/confirm}" method="post" style="display: inline;">
                <!-- データベースに保存するために、すべてのデータを裏側の隠し箱に入れます -->
                <input type="hidden" name="id" th:value="${form.id}">
                <input type="hidden" name="name" th:value="${form.name}">
                <input type="hidden" name="price" th:value="${form.price}">
                <input type="hidden" name="quantity" th:value="${form.quantity}">
                <input type="hidden" name="productCategoryId" th:value="${form.productCategoryId}">
                <input type="hidden" name="imageUrl" th:value="${form.imageUrl}">

                <button type="submit" name="action" value="complete" class="btn btn-fs-solid px-4">完了</button>
            </form>

            <!-- キャンセルは普通のリンクのままでOKです -->
            <a th:href="@{/admin/product}" class="btn btn-link link-fs">キャンセル</a>
        </div>
    </main>

    <div th:replace="~{admin/fragments/layout :: footer}"></div>
</body>

</html>
