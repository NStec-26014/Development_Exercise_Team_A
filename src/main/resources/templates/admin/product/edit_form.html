<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>商品修正(入力) - フルネス文具 管理画面</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div th:replace="~{admin/fragments/layout :: header}"></div>

<main class="container">
    <div class="admin-panel p-4 mx-auto" style="max-width: 560px;">
        <h1 class="text-center mb-4">商品修正(入力)</h1>

        <ul class="alert alert-danger" th:if="${errorMessages}">
            <li th:each="msg : ${errorMessages}" th:text="${msg}"></li>


    <!-- <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}" style="background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; padding: 20px; border-radius: 4px; margin-bottom: 20px;">
        <h1 class="text-center mb-4">商品修正(入力)</h1>
        <ul style="margin-bottom: 0; padding-left: 20px;">
            <li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li> -->


        </ul>

        <form th:action="@{/admin/product/edit}" th:object="${form}" method="post" enctype="multipart/form-data">
            <!-- 💡 画面には見えないけれど、修正・更新に絶対に不可欠な「商品ID」と「現在の画像URL」を隠し持たせます -->
            <input type="hidden" th:field="*{id}" />
            <input type="hidden" th:field="*{imageUrl}" />

            <div class="mb-3 row">
                <label class="col-sm-4 col-form-label">商品名</label>
                <div class="col-sm-8">
                    <!-- 💡 th:field="*{name}" に書き換えました -->
                    <input type="text" th:field="*{name}" class="form-control" maxlength="20">
                    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger small mt-1"></div>
                </div>
            </div>
            <div class="mb-3 row">
                <label class="col-sm-4 col-form-label">単価</label>
                <div class="col-sm-8">
                    <!-- 💡 th:field="*{price}" に書き換えました -->
                    <input type="text" th:field="*{price}" class="form-control">
                    <div th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="text-danger small mt-1"></div>
                </div>
            </div>
            <div class="mb-3 row">
                <label class="col-sm-4 col-form-label">在庫数</label>
                <div class="col-sm-8">
                    <!-- 💡 th:field="*{quantity}" に書き換えました -->
                    <input type="text" th:field="*{quantity}" class="form-control">
                    <div th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}" class="text-danger small mt-1"></div>
            </div>
            <div class="mb-3 row">
                <label class="col-sm-4 col-form-label">商品カテゴリ</label>
                <div class="col-sm-8">
                    <!-- 💡 name="categoryId" から th:field="*{productCategoryId}" に変更しました（これで自動選択されます） -->
                    <select th:field="*{productCategoryId}" class="form-select">
                        <option th:each="cat : ${categories}"
                                th:value="${cat.id}"
                                th:text="${cat.name}"></option>
                    </select>
                    <div th:if="${#fields.hasErrors('productCategoryId')}" th:errors="*{productCategoryId}" class="text-danger small mt-1"></div>
                </div>
            </div>
            <div class="mb-3 row">
                <label class="col-sm-4 col-form-label">画像</label>
                <div class="col-sm-8">
                    <input type="file" name="image" class="form-control">
                </div>
            </div>
            <div class="text-center mb-3" th:if="*{imageUrl}">
                <!-- 💡 現在登録されている画像を表示します -->
                <img th:src="@{*{imageUrl}}" th:alt="*{name}" class="img-fluid" style="max-height: 160px;">
            </div>
            <div class="text-center mt-4">
                <a th:href="@{/admin/product}" class="btn btn-link link-fs">キャンセル</a>
                <!-- 💡 コントローラー側の仕様（editProductメソッド）に合わせ、ボタンを押したときは「完了」ではなく次の「確認」へ進む名前のほうが自然かもしれません -->
                <button type="submit" class="btn btn-fs-solid px-4">確認画面へ</button>
            </div>
        </form>

    </div>
</main>

<div th:replace="~{admin/fragments/layout :: footer}"></div>
</body>
</html>
